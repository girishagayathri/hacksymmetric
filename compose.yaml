name: okgadi-infra

services:
  postgres:
    image: postgres:17-alpine
    container_name: okgadi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: okgadi
      POSTGRES_USER: okgadi
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okgadi -d okgadi"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    container_name: okgadi-infra-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  mongo_data:
